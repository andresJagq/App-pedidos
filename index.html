<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>CalculaPedidos — Login</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#34d399">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pedidos">
<script>
  // Detecta si llegamos desde un enlace de recuperación de contraseña (antes de que Supabase procese la URL)
  window.__recovery = location.hash.indexOf('type=recovery') !== -1
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script>
  // Aplica el tema guardado antes de pintar para evitar parpadeo
  (function(){ try { if (localStorage.getItem('tema') === 'claro') document.documentElement.setAttribute('data-theme','light'); } catch(e){} })()
</script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0f0f0f; --card:#191919; --card2:#242424; --yellow:#34d399; --green:#4ade80;
    --red:#f87171; --muted:#6b6b6b; --text:#f0f0f0; --border:#2b2b2b;
    --brand:#34d399; --on-brand:#06281b; --danger-soft:#2a1414; --success-soft:#0e1f0e;
  }
  :root[data-theme="light"] {
    --bg:#f3f5f4; --card:#ffffff; --card2:#eef1ef; --yellow:#059669; --green:#16a34a;
    --red:#dc2626; --muted:#6b7280; --text:#111827; --border:#e2e6e3;
    --brand:#34d399; --on-brand:#06281b; --danger-soft:#fde4e4; --success-soft:#dcfce7;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; }

  .box { background:var(--card); border:1px solid var(--border); border-radius:24px; padding:32px 24px; width:100%; max-width:380px; display:flex; flex-direction:column; gap:20px; }
  .logo { font-family:'Bebas Neue',cursive; font-size:2.4rem; color:var(--yellow); line-height:1; }
  .logo span { color:var(--text); }
  .sub { font-size:0.82rem; color:var(--muted); margin-top:4px; line-height:1.4; }

  .tabs { display:flex; background:var(--card2); border-radius:10px; padding:3px; gap:3px; }
  .tab { flex:1; padding:8px; text-align:center; border-radius:8px; font-size:0.82rem; font-weight:600; color:var(--muted); cursor:pointer; transition:all 0.2s; }
  .tab.active { background:var(--brand); color:var(--on-brand); }

  .field { display:flex; flex-direction:column; gap:6px; }
  .field label { font-size:0.75rem; color:var(--muted); font-weight:600; letter-spacing:1px; text-transform:uppercase; }
  .field input { background:var(--card2); border:1px solid var(--border); border-radius:11px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1rem; padding:13px 14px; outline:none; transition:border-color 0.2s; }
  .field input:focus { border-color:var(--yellow); }

  .btn { background:var(--brand); color:var(--on-brand); border:none; border-radius:11px; font-family:'Bebas Neue',cursive; font-size:1.3rem; letter-spacing:1px; padding:14px; cursor:pointer; transition:opacity 0.2s,transform 0.1s; width:100%; }
  .btn:active { transform:scale(0.97); }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }

  .error { background:var(--danger-soft); border:1px solid var(--red); border-radius:10px; padding:10px 14px; font-size:0.82rem; color:var(--red); display:none; }
  .success { background:var(--success-soft); border:1px solid var(--green); border-radius:10px; padding:10px 14px; font-size:0.82rem; color:var(--green); display:none; }
  .tema-toggle { background:none; border:none; color:var(--muted); font-size:0.8rem; cursor:pointer; font-family:'DM Sans',sans-serif; padding:6px; align-self:center; }
  .tema-toggle:hover { color:var(--yellow); }
  .linklike { background:none; border:none; color:var(--yellow); font-size:0.78rem; cursor:pointer; font-family:'DM Sans',sans-serif; padding:2px 0; text-decoration:underline; align-self:flex-end; }
  .support { text-align:center; font-size:0.78rem; color:var(--muted); line-height:1.5; }
  .support a { color:var(--yellow); text-decoration:none; font-weight:600; }
</style>
</head>
<body>
<div class="box">
  <div>
    <div class="logo">Calcula<span>Pedidos</span></div>
    <div class="sub" id="welcomeSub">👋 ¡Bienvenido! Ingresa para registrar tus ganancias</div>
  </div>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>

  <!-- Panel normal de ingreso / registro -->
  <div id="loginPanel" style="display:flex;flex-direction:column;gap:20px;">
    <div class="tabs">
      <div class="tab active" onclick="setTab('login')">Ingresar</div>
      <div class="tab" onclick="setTab('register')">Registrarse</div>
    </div>

    <div id="nombreField" class="field" style="display:none;">
      <label>Nombre</label>
      <input type="text" id="nombre" placeholder="Tu nombre" maxlength="40">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="correo@email.com">
    </div>
    <div class="field">
      <label>Contraseña</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="linklike" id="forgotLink" onclick="recuperarPassword()">¿Olvidaste tu contraseña?</button>

    <button class="btn" id="btnAction" onclick="action()">ENTRAR →</button>
  </div>

  <!-- Panel para elegir nueva contraseña (aparece al llegar desde el correo de recuperación) -->
  <div id="resetPanel" style="display:none;flex-direction:column;gap:20px;">
    <div class="field">
      <label>Nueva contraseña</label>
      <input type="password" id="newPass" placeholder="••••••••">
    </div>
    <div class="field">
      <label>Repite la contraseña</label>
      <input type="password" id="newPass2" placeholder="••••••••">
    </div>
    <button class="btn" onclick="actualizarPassword()">GUARDAR CONTRASEÑA</button>
  </div>

  <button class="tema-toggle" id="temaToggle" onclick="toggleTema()">🌙 Cambiar tema</button>
  <div class="support">¿Problemas para entrar? <a href="mailto:trabajojagq@gmail.com?subject=Problema%20para%20iniciar%20sesi%C3%B3n%20-%20CalculaPedidos">Escríbenos a soporte ✉️</a></div>
</div>

<script>
let mode = 'login'

// ── TEMA (claro / oscuro) ──
function toggleTema() {
  const claro = document.documentElement.getAttribute('data-theme') === 'light'
  if (claro) document.documentElement.removeAttribute('data-theme')
  else document.documentElement.setAttribute('data-theme', 'light')
  try { localStorage.setItem('tema', claro ? 'oscuro' : 'claro') } catch (e) {}
  actualizarTemaLabel()
}
function actualizarTemaLabel() {
  const claro = document.documentElement.getAttribute('data-theme') === 'light'
  document.getElementById('temaToggle').textContent = claro ? '🌙 Modo oscuro' : '☀️ Modo claro'
}
actualizarTemaLabel()

// ── RECUPERACIÓN DE CONTRASEÑA ──
let recoveryMode = false
// Cuando el usuario abre el enlace del correo, Supabase dispara este evento
sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') { recoveryMode = true; mostrarReset() }
})
function mostrarReset() {
  document.getElementById('loginPanel').style.display = 'none'
  document.getElementById('resetPanel').style.display = 'flex'
  document.getElementById('welcomeSub').textContent = '🔑 Elige tu nueva contraseña'
  hide()
}
// Enviar el correo con el enlace de recuperación
async function recuperarPassword() {
  const email = document.getElementById('email').value.trim()
  if (!email) return showError('Escribe tu email arriba y toca de nuevo "¿Olvidaste tu contraseña?"')
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname })
  if (error) { showError('No se pudo enviar el correo. Revisa que el email sea correcto.'); return }
  showSuccess('📧 Te enviamos un correo para restablecer tu contraseña. Revisa tu bandeja (y la carpeta de spam).')
}
// Guardar la nueva contraseña
async function actualizarPassword() {
  const p1 = document.getElementById('newPass').value
  const p2 = document.getElementById('newPass2').value
  if (!p1 || p1.length < 6) return showError('La contraseña debe tener al menos 6 caracteres')
  if (p1 !== p2) return showError('Las contraseñas no coinciden')
  const { error } = await sb.auth.updateUser({ password: p1 })
  if (error) { showError('No se pudo actualizar. El enlace pudo expirar; pide otro correo.'); return }
  showSuccess('✅ Contraseña actualizada. Ya puedes ingresar.')
  await sb.auth.signOut()
  setTimeout(() => { location.href = location.origin + location.pathname }, 1600)
}

async function checkSession() {
  // Si venimos de un enlace de recuperación, NO entrar directo: dejar elegir nueva contraseña
  if (window.__recovery) { mostrarReset(); return }
  const { data: { session } } = await sb.auth.getSession()
  if (session && !recoveryMode) window.location.href = 'app.html'
}
checkSession()

function setTab(m) {
  mode = m
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', (i===0&&m==='login')||(i===1&&m==='register')))
  document.getElementById('nombreField').style.display = m === 'register' ? 'flex' : 'none'
  document.getElementById('forgotLink').style.display = m === 'login' ? 'block' : 'none'
  document.getElementById('btnAction').textContent = m === 'login' ? 'ENTRAR →' : 'REGISTRARSE →'
  hide()
}

function showError(msg) {
  const el = document.getElementById('errorMsg')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('successMsg').style.display = 'none'
}
function showSuccess(msg) {
  const el = document.getElementById('successMsg')
  el.textContent = msg; el.style.display = 'block'
  document.getElementById('errorMsg').style.display = 'none'
}
function hide() {
  document.getElementById('errorMsg').style.display = 'none'
  document.getElementById('successMsg').style.display = 'none'
}

async function action() {
  const email = document.getElementById('email').value.trim()
  const password = document.getElementById('password').value
  const btn = document.getElementById('btnAction')

  if (!email || !password) return showError('Completa todos los campos')
  btn.disabled = true

  if (mode === 'login') {
    const { error } = await sb.auth.signInWithPassword({ email, password })
    if (error) { showError('Email o contraseña incorrectos'); btn.disabled = false; return }
    window.location.href = 'app.html'
  } else {
    const nombre = document.getElementById('nombre').value.trim()
    if (!nombre) { showError('Ingresa tu nombre'); btn.disabled = false; return }
    const { error } = await sb.auth.signUp({
      email, password,
      options: { data: { nombre } }
    })
    if (error) { showError(error.message); btn.disabled = false; return }
    showSuccess('✅ Cuenta creada. Ya puedes ingresar.')
    setTab('login')
    btn.disabled = false
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Enter') action() })

// Registrar el service worker (permite instalar la app y usarla sin conexión)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))
}
</script>
</body>
</html>
